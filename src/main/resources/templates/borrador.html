

<div class="container">
    <div class="row">
        <div class="col-lg-6 col-md-6 col-sm-6 container justify-content-center card">
            <div class="text-center" style="font-size: 30px;">Create New Student</div>
            <div class="card-body"></div>
            <form th:action="@{/students}" th:object="${student}" method="post">

                <div class="form-group">
                    <label>Student First Name</label> <input type="text"
                            name="firstName" class=" form-control"
                            placeholer="Enter Student FirstName">
                </div>

                
                <div class="form-group">
                    <label>Student last Name</label> <input type="text"
                            name="lastName" class=" form-control"
                            placeholder="Enter Student lastName">
                </div>

                <div class="form-group">
                    <label>Student Email</label> <input type="text"
                            name="email" class=" form-control"
                            placeholder="Enter Student Email">
                </div>

                <div class="box-footer">
                    <button type="submit" class="btn btn-primary">Submit</button>
                </div>
                
            </form>
        </div>
    </div>
</div>
